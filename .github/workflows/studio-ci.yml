name: Podcast Studio CI

on:
  push:
    branches:
      - main
      - codex/captions-grade-editor-20260824
    paths:
      - "studio/**"
      - ".github/workflows/studio-ci.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-14
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: studio/pyproject.toml

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build

      - name: Compile source with warnings promoted
        env:
          PYTHONWARNINGS: error
        run: python -m compileall -q src

      - name: Run unit and integration tests
        run: pytest -q --maxfail=1

      - name: Validate CLI surface
        run: |
          podcast-studio --help
          podcast-studio doctor --json || true

      - name: Validate MCP handshake and tool discovery
        run: |
          python - <<'PY'
          from podcast_studio.mcp_server import handle_message
          init = handle_message({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}})
          tools = handle_message({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          assert init["result"]["serverInfo"]["name"] == "podcast-studio"
          assert len(tools["result"]["tools"]) >= 15
          print(f"MCP tools: {len(tools['result']['tools'])}")
          PY

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/podcast-studio-wheel-test
          /tmp/podcast-studio-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/podcast-studio-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/podcast-studio-wheel-test/bin/podcast-studio --help
          /tmp/podcast-studio-wheel-test/bin/python - <<'PY'
          from pathlib import Path
          import podcast_studio
          from podcast_studio.mcp_server import TOOLS
          template = Path(podcast_studio.__file__).parent / "templates" / "podcast-editor" / "SKILL.md"
          assert template.is_file(), template
          assert len(TOOLS) >= 15
          print(template)
          PY

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: podcast-studio-dist
          path: studio/dist/*
          if-no-files-found: error
